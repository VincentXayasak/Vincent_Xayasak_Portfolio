<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincent Xayasak — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene" id="scene">
    <div class="room" id="room">

      <div class="wall"></div>
      <div class="floor" aria-hidden="true"></div>
      <div class="room-vignette" aria-hidden="true"></div>
      <div class="color-wash" aria-hidden="true"></div>
      <div class="monitor-light" aria-hidden="true"></div>

      <svg class="ivy-svg" viewBox="0 0 140 500" aria-hidden="true">
        <path d="M35 500 Q22 380 40 320 Q12 260 45 200 Q28 140 50 80 Q38 40 55 0" fill="none" stroke="#3a7a42" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="20" cy="400" rx="16" ry="10" fill="#4a9a52" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="58" cy="340" rx="14" ry="9" fill="#3d8a45" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="24" cy="270" rx="17" ry="11" fill="#5aaa62" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="62" cy="210" rx="15" ry="10" fill="#4a9a52" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="30" cy="150" rx="16" ry="10" fill="#3d8a45" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="52" cy="90" rx="14" ry="9" fill="#5aaa62" stroke="#2a1f18" stroke-width="2.5"/>
        <ellipse cx="38" cy="40" rx="12" ry="8" fill="#4a9a52" stroke="#2a1f18" stroke-width="2.5"/>
      </svg>

      <div class="room-layout">

        <aside class="zone zone-left">
          <div class="corkboard">
            <div class="cork-wood-frame"></div>
            <div class="cork-surface">
              <div class="note n-y"><span>ideas!!</span></div>
              <div class="note n-b"><span>todo</span></div>
              <div class="note n-p"><span>call mom</span></div>
              <div class="note n-v"><span>sketch</span></div>
              <div class="note n-o"><span>wip</span></div>
              <div class="polaroid p1"><div class="polaroid-art"></div></div>
              <div class="polaroid p2"><div class="polaroid-art"></div></div>
              <div class="pin" style="--x:16%;--y:12%;--c:#e55"></div>
              <div class="pin" style="--x:44%;--y:10%;--c:#48b"></div>
              <div class="pin" style="--x:72%;--y:16%;--c:#e5a"></div>
              <div class="pin" style="--x:28%;--y:52%;--c:#5b5"></div>
            </div>
          </div>

          <div class="bookshelf">
            <div class="shelf-body wood">
              <div class="book-row">
                <i class="book" style="--c:#d45555;--h:90%"></i>
                <i class="book" style="--c:#5588cc;--h:84%"></i>
                <i class="book" style="--c:#55aa66;--h:92%"></i>
                <i class="book" style="--c:#cc8844;--h:80%"></i>
                <i class="book" style="--c:#9966bb;--h:86%"></i>
              </div>
              <div class="shelf-board"></div>
              <div class="book-row row-2">
                <i class="book" style="--c:#4488aa;--h:76%"></i>
                <i class="book" style="--c:#aa6688;--h:72%"></i>
                <i class="book" style="--c:#66aa88;--h:78%"></i>
                <i class="book" style="--c:#cc6666;--h:74%"></i>
                <i class="book" style="--c:#6688cc;--h:77%"></i>
              </div>
              <div class="shelf-board"></div>
              <div class="book-row row-3">
                <i class="book" style="--c:#d4a050;--h:82%"></i>
                <i class="book" style="--c:#7a5aaa;--h:70%"></i>
                <i class="book" style="--c:#50a0a0;--h:88%"></i>
                <i class="book" style="--c:#c06080;--h:75%"></i>
                <i class="book" style="--c:#88aa44;--h:80%"></i>
              </div>
            </div>
          </div>
        </aside>

        <main class="zone zone-center">
          <div class="monitor-assembly" id="computer">
            <div class="monitor">
              <div class="crt-frame">
                <div class="crt-screen" id="crt-screen">
                  <p class="screen-title" id="screen-title">Vincent Xayasak Portfolio</p>
                  <p class="screen-loading" id="screen-loading-label">LOADING</p>
                  <div class="screen-bar" id="screen-bar">
                    <div class="screen-bar-fill" id="screen-bar-fill"></div>
                  </div>
                  <div class="screen-body" id="screen-body" hidden></div>
                  <nav class="screen-dock" id="screen-dock" aria-label="Portfolio navigation">
                    <button type="button" class="dock-btn" data-section="projects" aria-label="Projects">
                      <span class="si-folder"></span>
                    </button>
                    <button type="button" class="dock-btn" data-section="art" aria-label="Art">
                      <span class="si-brush"></span>
                    </button>
                    <button type="button" class="dock-btn active" data-section="code" aria-label="Code">
                      <span class="si-code"></span>
                    </button>
                    <button type="button" class="dock-btn" data-section="settings" aria-label="Settings">
                      <span class="si-gear"></span>
                    </button>
                  </nav>
                  <div class="screen-cursor" id="screen-cursor"></div>
                </div>
              </div>
              <div class="crt-chin"></div>
              <div class="crt-stand"></div>
              <div class="crt-base"></div>
            </div>
          </div>

          <div class="main-desk wood">
            <div class="desk-top"></div>
          </div>
        </main>

        <aside class="zone zone-right">
          <div class="window">
            <div class="win-outer">
              <div class="win-scene">
                <div class="sky"></div>
                <div class="moon"></div>
                <div class="cloud cloud-a"></div>
                <div class="cloud cloud-b"></div>
                <div class="bird bird-a"></div>
                <div class="bird bird-b"></div>
                <div class="bird bird-c"></div>
                <div class="city">
                  <i style="--h:58%;--c:#5a7aaa"></i>
                  <i style="--h:74%;--c:#9a6a9a"></i>
                  <i style="--h:46%;--c:#d4aa50"></i>
                  <i style="--h:64%;--c:#5a9a7a"></i>
                  <i style="--h:84%;--c:#7a6aaa"></i>
                  <i style="--h:50%;--c:#c98a6a"></i>
                </div>
                <div class="win-mullion-v"></div>
                <div class="win-mullion-h"></div>
              </div>
            </div>
            <div class="win-sill"></div>
          </div>

          <div class="radio-area">
            <div class="boombox">
              <div class="bb-carry-handle"></div>
              <div class="bb-control-strip">
                <span class="bb-ctrl-knob"></span>
                <span class="bb-tuner"></span>
                <span class="bb-ctrl-knob sm"></span>
                <span class="bb-ctrl-knob sm"></span>
              </div>
              <div class="bb-main">
                <div class="bb-spk"><div class="bb-spk-ring"></div><div class="bb-spk-cone"></div></div>
                <div class="bb-tape">
                  <div class="bb-tape-window"><span class="bb-reel"></span><span class="bb-reel"></span></div>
                </div>
                <div class="bb-spk"><div class="bb-spk-ring"></div><div class="bb-spk-cone"></div></div>
              </div>
            </div>

            <div class="radio-table wood">
              <div class="radio-table-top"></div>
              <div class="radio-table-leg"></div>
              <div class="peeking-leaf" aria-hidden="true"></div>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </div>

  <header class="hud">
    <span class="hud-title">Vincent Xayasak</span>
    <span id="time-display">00:00</span>
  </header>

  <footer class="hud-bottom">
    <p id="hint-text">Click the dock icons on the monitor to explore</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
